<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeMaster Live - Modern Web Typing Test</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyberpunk">
    <canvas id="particle-canvas"></canvas>

    <div class="app-container">
        <!-- Header Section -->
        <header>
            <div class="logo-area">
                <span class="logo-icon">⚡</span>
                <h1>TypeMaster <span class="accent-text">Live v1.0</span></h1>
            </div>
            <div class="settings-bar">
                <button id="sound-btn" class="icon-btn" title="Toggle Sound">
                    <span class="btn-icon">🔊</span>
                </button>
                <div class="theme-picker-container">
                    <button id="theme-btn" class="icon-btn" title="Change Theme">
                        <span class="btn-icon">🎨</span>
                    </button>
                    <div class="theme-dropdown" id="theme-dropdown">
                        <button class="theme-opt" data-theme="cyberpunk">Cyberpunk Neon</button>
                        <button class="theme-opt" data-theme="dark-console">Dark Console</button>
                        <button class="theme-opt" data-theme="ocean">Ocean Breeze</button>
                        <button class="theme-opt" data-theme="sakura">Sakura Bloom</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main>
            <!-- Player Setup / Profile Card -->
            <section class="profile-section card glass">
                <div class="profile-info">
                    <span class="avatar">👤</span>
                    <div>
                        <h2 id="display-username">Anonymous</h2>
                        <p class="subtitle">Ready to test your fingers?</p>
                    </div>
                </div>
                <button id="change-user-btn" class="btn secondary-btn">Change Username</button>
            </section>

            <!-- Typing Modes Selector -->
            <section class="modes-section">
                <button class="mode-tab active" data-mode="standard">Standard</button>
                <button class="mode-tab" data-mode="numbers">Numbers</button>
                <button class="mode-tab" data-mode="quotes">Quotes</button>
                <button class="mode-tab" data-mode="custom">Custom Text</button>
            </section>

            <!-- Custom Text Input Modal Content -->
            <div id="custom-text-panel" class="custom-text-panel card glass hidden">
                <h3>Enter Custom Prompt Text</h3>
                <textarea id="custom-text-input" placeholder="Paste your custom paragraph here to practice typing it..."></textarea>
                <div class="custom-panel-actions">
                    <button id="apply-custom-btn" class="btn primary-btn">Apply Prompt</button>
                    <button id="cancel-custom-btn" class="btn text-btn">Cancel</button>
                </div>
            </div>

            <!-- Stats Bar -->
            <section class="stats-grid">
                <div class="stat-card card glass">
                    <div class="stat-label">Net WPM</div>
                    <div class="stat-val" id="stat-wpm">00</div>
                    <div class="stat-delta" id="stat-wpm-sub">gross: 00</div>
                </div>
                <div class="stat-card card glass">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-val" id="stat-accuracy">100%</div>
                    <div class="stat-delta" id="stat-accuracy-sub">0 mistakes</div>
                </div>
                <div class="stat-card card glass">
                    <div class="stat-label">Time Remaining</div>
                    <div class="stat-val" id="stat-time">30s</div>
                    <div class="stat-delta" id="stat-time-sub">stopwatch active</div>
                </div>
            </section>
